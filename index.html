<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open house folder from Devin Kampa</title>
<style>
:root{
  --bg1:#fbfbfd;--bg2:#f0f0f4;--bg3:#e4e4ea;
  --haze:rgba(244,244,247,.92);
  --ink:#1d1d1f;--ink2:#5f5f66;
  --pill:rgba(255,255,255,.78);--pillb:rgba(0,0,0,.10);
  --accent:#0b66c3;--accent-ink:#fff;
  --sh:rgba(12,24,56,.34);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#23242a;--bg2:#17181c;--bg3:#0d0d10;
    --haze:rgba(14,15,18,.92);
    --ink:#f5f5f7;--ink2:#a6a6ae;
    --pill:rgba(44,45,52,.78);--pillb:rgba(255,255,255,.14);
    --accent:#4da3ff;--accent-ink:#06111f;
    --sh:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg1:#23242a;--bg2:#17181c;--bg3:#0d0d10;
  --haze:rgba(14,15,18,.92);
  --ink:#f5f5f7;--ink2:#a6a6ae;
  --pill:rgba(44,45,52,.78);--pillb:rgba(255,255,255,.14);
  --accent:#4da3ff;--accent-ink:#06111f;
  --sh:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 95% at 50% 38%,var(--bg1) 0%,var(--bg2) 62%,var(--bg3) 100%);z-index:1}
#par,#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#par{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#cam{transition:transform 1.7s cubic-bezier(.55,0,.15,1)}
.inst,.inst *{transition:none!important}

.panel{position:absolute;width:600px;height:800px;transform-style:preserve-3d}
#base{left:0;top:-400px}
#cover{left:0;top:-400px;transform-origin:0 50%;will-change:transform;
  transition:transform 1.9s cubic-bezier(.62,0,.2,1),translate .5s ease 2s;
  transform:rotateY(0deg);translate:0 0 36px}
/* contents stay hidden until the cover has swung past vertical, so nothing can show through it */
.layer,.pocketwrap{visibility:visible;transition:visibility 0s linear .9s}
#stage.is-closed .layer,#stage.is-closed .pocketwrap{visibility:hidden;transition:none}
.floor{position:absolute;top:-400px;width:600px;height:800px;border-radius:8px;transform:translateZ(-4px);
  box-shadow:0 34px 70px var(--sh),0 8px 20px rgba(10,20,50,.22);transition:opacity .6s ease}
#floorR{left:0}
#floorL{left:-600px;opacity:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.paperbg{background:
  linear-gradient(160deg,#14275a 0%,#0f2149 52%,#0b1a3b 100%)}
.inner{position:absolute;inset:0;background:linear-gradient(165deg,#12265a 0%,#0e2048 55%,#0a1836 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
#base .inner{border-radius:3px 10px 10px 3px}
.cb{transform:rotateY(180deg);transform-style:preserve-3d}
.cb .inner{border-radius:10px 3px 3px 10px;background:linear-gradient(195deg,#12265a 0%,#0e2048 55%,#0a1836 100%)}
.crease{position:absolute;top:0;bottom:0;width:46px;pointer-events:none}
#base .crease{left:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.12) 40%,transparent)}
.cb .crease{right:0;background:linear-gradient(270deg,rgba(0,0,0,.45),rgba(0,0,0,.12) 40%,transparent)}

.cf{border-radius:4px 12px 12px 4px;
  background:linear-gradient(155deg,#17306a 0%,#10244f 48%,#0b1a3c 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 18px 0 22px -14px rgba(0,0,0,.6)}
.cf::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(120deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%);pointer-events:none}
.cf .logo{position:absolute;left:150px;top:318px;width:300px;opacity:.94;filter:drop-shadow(0 1px 0 rgba(255,255,255,.16)) drop-shadow(0 -1px 1px rgba(0,0,0,.55))}
.cf .sig{position:absolute;left:0;right:0;top:418px;text-align:center;color:rgba(255,255,255,.72);
  font-size:15px;line-height:1.5;letter-spacing:.01em}
.cf .sig b{display:block;color:#fff;font-weight:600;font-size:17px;margin-bottom:2px}
.cf .rule{position:absolute;left:260px;width:80px;top:396px;height:1px;background:rgba(255,255,255,.28)}
.cf .spine{position:absolute;left:0;top:0;bottom:0;width:22px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.05) 55%,rgba(0,0,0,.12));
  border-radius:4px 0 0 4px}

/* pockets */
.pocketwrap{position:absolute;left:0;bottom:0;width:600px;height:272px;transform:translateZ(14px);
}
.pocketwrap::after{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,0));
  -webkit-mask-image:radial-gradient(circle 52px at 50% 14px,transparent 50px,#000 51px);
          mask-image:radial-gradient(circle 52px at 50% 14px,transparent 50px,#000 51px)}
.pocket{position:absolute;inset:0;
  background:linear-gradient(180deg,#183069 0%,#13285b 40%,#102250 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
  -webkit-mask-image:radial-gradient(circle 52px at 50% 0,transparent 50px,#000 51px);
          mask-image:radial-gradient(circle 52px at 50% 0,transparent 50px,#000 51px)}
#base .pocket{border-radius:0 0 10px 3px}
.cb .pocket{border-radius:0 0 3px 10px}
.pocket i{position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.2);border-top:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle 60px at 50% -10px,transparent 58px,#000 59px);
          mask-image:radial-gradient(circle 60px at 50% -10px,transparent 58px,#000 59px)}
.layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}

/* items */
.item,.s1,.s2{transform-style:preserve-3d}
.item{position:absolute;left:0;top:0;pointer-events:none}
.zone{position:absolute;pointer-events:none;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
#stage.ex .zone{pointer-events:auto}
.zone:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.s1,.s2{position:absolute;inset:0}
.sheet{background-size:100% 100%;background-repeat:no-repeat;border-radius:1px;
  box-shadow:0 1px 1px rgba(0,0,0,.28),0 3px 9px rgba(0,0,0,.2);transition:box-shadow .9s ease}
.item.fz .sheet{box-shadow:0 2px 3px rgba(0,0,0,.18),0 34px 70px rgba(0,0,0,.34)}
.copy{position:absolute;background-repeat:no-repeat;box-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
.p{position:absolute;top:0;transform-style:preserve-3d;transform-origin:0% 50%}
.p .f,.p .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background-repeat:no-repeat;background-size:678px 527px}
.p .b{transform:rotateY(180deg)}
.p>.f{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tsh{position:absolute;inset:0;transform:translateZ(-5px);box-shadow:0 2px 3px rgba(0,0,0,.2),0 34px 70px rgba(0,0,0,.34);
  opacity:0;transition:opacity .7s ease;pointer-events:none}

/* business card */
.cardwrap{position:absolute;inset:0}
.bc{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(118deg,#111a42 0%,#18235a 62%,#141d4e 100%);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,24px 100%,0 calc(100% - 24px));
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.bc .bl{position:absolute;left:18px;top:16px;width:124px;height:auto}
.bc .bn{position:absolute;left:18px;top:60px;font-size:19px;font-weight:700;letter-spacing:.005em}
.bc .br{position:absolute;left:18px;top:86px;font-size:9.5px;line-height:1.35;color:rgba(255,255,255,.9)}
.bc .bp{position:absolute;left:18px;top:116px;font-size:12.5px;font-weight:700}
.bc .bp b{color:#8196d6;font-weight:700;margin-right:3px}
.bc .bm{position:absolute;left:18px;top:150px;font-size:8.8px;line-height:1.55;color:rgba(255,255,255,.95)}
.bc .bph{position:absolute;left:232px;top:16px;width:98px;height:134px;border-radius:10px;
  background-size:cover;background-position:center;box-shadow:0 0 0 2px rgba(95,130,205,.42)}
.bc .bs{position:absolute;right:0;top:0;bottom:0;width:13px;background:linear-gradient(180deg,#38589a,#273f78)}
.slit{position:absolute;height:2px;width:34px;background:rgba(0,0,0,.65);box-shadow:0 1px 0 rgba(255,255,255,.14)}
.slit.a{left:-5px;bottom:12px;transform:rotate(45deg)}
.slit.b{right:-5px;bottom:12px;transform:rotate(-45deg)}

#haze{position:absolute;left:-5000px;top:-4000px;width:10000px;height:8000px;background:var(--haze);
  opacity:0;transform:translateZ(150px);transition:opacity 1s ease;pointer-events:none}

#backdrop{position:fixed;inset:0;z-index:2;display:none}
#backdrop.on{display:block;cursor:zoom-out}

/* ---------- ui ---------- */
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui>*{pointer-events:auto}
#cap{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(92vw,680px);text-align:center;pointer-events:none}
#cap>*{pointer-events:auto}
#cap .txt{transition:opacity .35s ease,transform .35s ease}
#cap .txt.out{opacity:0;transform:translateY(6px)}
#cap h1{font-size:clamp(22px,3.1vw,32px);font-weight:600;letter-spacing:-.018em;line-height:1.12}
#cap p{margin-top:8px;font-size:clamp(14px,1.7vw,17px);line-height:1.4;color:var(--ink2);text-wrap:balance}
#cap .capx{margin-top:12px;font-size:clamp(15px,1.9vw,18px);font-weight:600;line-height:1.35;color:var(--ink);text-wrap:balance}
#cap .capx:empty{display:none}
#cta{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;
  background:var(--pill);border:1px solid var(--pillb);text-decoration:none;font-size:15px;font-weight:500;cursor:pointer;
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);transition:transform .2s ease,background .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding:0 26px;font-weight:600}
.hide{display:none!important}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--pill);border:1px solid var(--pillb);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
#bar button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
#bar button:hover{background:rgba(127,127,127,.16)}
#bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#dots{display:flex;gap:8px;padding:0 6px}
#dots button{width:22px;height:22px;background:transparent;border-radius:50%;display:grid;place-items:center}
#dots button::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.28;transition:all .35s ease}
#dots button.on::after{opacity:1;width:20px;border-radius:4px}
#dots button{width:auto;min-width:22px;border-radius:12px}
#top{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px}
#top .btn{min-height:40px;padding:0 16px;font-size:14px}
#reader{position:fixed;inset:0;z-index:5;background:var(--haze);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#reader.on{display:block}
#reader .pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:72px 12px calc(40px + env(safe-area-inset-bottom,0px))}
#reader img{width:min(100%,1100px);height:auto;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.28);background:#fff}
#readerClose{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:6}
@media (max-width:640px){
  #cap{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  #top .btn{padding:0 13px}
}
@media (prefers-reduced-motion:reduce){ #par{transition:none} }
</style>
</head>
<body>

<div id="stage" class="is-closed">
  <div id="par"><div id="cam">
    <div class="floor" id="floorR"></div>
    <div class="floor" id="floorL"></div>

    <div class="panel" id="base">
      <div class="inner"></div><div class="noise"></div><div class="crease"></div>
      <div class="layer" id="itemsR"></div>
      <div class="pocketwrap"><div class="pocket"><i></i></div></div>
      <div class="layer" id="cardsR"></div>
    </div>

    <div class="panel" id="cover">
      <div class="face cf" id="coverFront">
        <div class="noise"></div><div class="spine"></div>
        <img class="logo" alt="Highlands Residential Mortgage" id="coverLogo">
        <div class="rule"></div>
        <div class="sig"><b>Devin Kampa</b>Loan Officer, NMLS #2532480</div>
      </div>
      <div class="face cb" id="faceL">
        <div class="inner"></div><div class="noise"></div><div class="crease"></div>
        <div class="layer" id="itemsL"></div>
        <div class="pocketwrap"><div class="pocket"><i></i></div></div>
      </div>
    </div>

    <div id="haze"></div>
  </div></div>
</div>
<div id="backdrop"></div>

<div id="ui">
  <div id="top">
    <button class="btn hide" id="flipB" type="button">Flip over</button>
    <button class="btn hide" id="fullB" type="button">View full size</button>
    <button class="btn hide" id="closeB" type="button">Close</button>
    <button class="btn hide" id="skipB" type="button">Skip to the end</button>
    <button class="btn hide" id="replayB" type="button">Replay</button>
  </div>

  <div id="cap">
    <div class="txt" id="capTxt"><h1 id="capT"></h1><p id="capS"></p><p id="capX" class="capx"></p></div>
    <div id="cta">
      <button class="btn primary" id="openB" type="button">Open the folder</button>
      <div id="contact" class="hide" style="display:contents">
        <a class="btn primary" id="callB" href="tel:+13202415823">Call Devin</a>
        <a class="btn" id="textB" href="sms:+13202415823">Text</a>
        <a class="btn" id="mailB" href="mailto:dkampa@highlandsmortgage.com">Email</a>
      </div>
    </div>

  <div id="bar" class="hide">
    <button id="prevB" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="dots"></div>
    <button id="nextB" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="ppB" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" id="ppI"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>
</div>

<div id="reader"><button class="btn" id="readerClose" type="button">Close</button><div class="pages" id="readerPages"></div></div>

<script>
(()=>{
const FZ=240, SLIDE=250, PW=226, PH=527, SHW=678;
/* gatefold: middle column stays put; left and right columns fold in over it (left on top) */
const FL='translateZ(2px) rotateY(180deg)', UL='translateZ(2px) rotateY(0deg)', FR='translateZ(1px) rotateY(-180deg)', UR='translateZ(1px) rotateY(0deg)';
const E1='cubic-bezier(.5,0,.15,1)', E2='cubic-bezier(.45,0,.2,1)', E3='cubic-bezier(.2,.8,.2,1)';
const $=s=>document.querySelector(s);
const div=(cls,parent,css)=>{const d=document.createElement('div');if(cls)d.className=cls;if(css)d.style.cssText=css;if(parent)parent.appendChild(d);return d};
const stage=$('#stage'), par=$('#par'), cam=$('#cam'), cover=$('#cover'), floorL=$('#floorL'), haze=$('#haze');
$('#coverLogo').src=IMG.logo;

/* ---------- items ---------- */
const items={}, order=[];
function pose(it,p){
  it.el.style.translate=`${p.x+it.ox-it.w/2}px ${p.y+it.oy-it.h/2}px`;
  it.el.style.transform=`translateZ(${p.z}px) rotateZ(${p.rz||0}deg) rotateY(${p.flip?180:0}deg) scale(${p.s||1})`;
}
function mk(id,o){
  const host=$(o.parent==='L'?'#itemsL':'#itemsR');
  const el=div('item',host,`width:${o.w}px;height:${o.h}px`);
  const s1=div('s1',el), s2=div('s2',s1);
  const it=Object.assign({id,el,s1,s2,ox:o.parent==='L'?600:0,oy:400,state:'rest',flip:0,slide:o.slide===undefined?SLIDE:o.slide},o);
  o.build(s2,it); pose(it,o.rest);
  items[id]=it; order.push(it); return it;
}
function paper(id,parent,key,rest,focusX){
  return mk(id,{parent,w:530,h:682,fw:530,fh:682,type:'paper',key,rest,
    focus:{x:focusX,y:-30,z:FZ,rz:0},
    build:(s2)=>{s2.classList.add('sheet');s2.style.backgroundImage=`url(${IMG[key]})`}});
}
function stackCopies(parent,keyOut,rx,ry){
  const host=$(parent==='L'?'#itemsL':'#itemsR'), ox=parent==='L'?600:0;
  const offs=[[-6,-7,-.9,3],[3,-3,.6,4],[-2,-10,-.4,5],[5,-5,.8,6]];
  offs.forEach(([dx,dy,r,z])=>{
    const c=div('copy',host,`width:${PW}px;height:${PH}px;background-image:url(${IMG[keyOut]});background-size:${SHW}px ${PH}px;background-position:${-2*PW}px 0;`+
      `translate:${rx+dx+ox-PW/2}px ${ry+dy+400-PH/2}px;transform:translateZ(${z}px) rotateZ(${r}deg)`);
  });
}
function tri(id,parent,out,inn,restR,restY){
  stackCopies(parent,out,restR,restY);
  const it=mk(id,{parent,w:SHW,h:PH,fw:SHW,fh:PH,type:'tri',out,inn,
    rest:{x:restR,y:restY,z:9,rz:0},focus:{x:-300,y:-30,z:FZ,rz:0},
    build:(s2,it)=>{
      const sh=div('tsh',s2); it.tsh=sh;
      const sheet=div('',s2,'position:absolute;inset:0;transform-style:preserve-3d');
      /* front faces = the inside page (what you see once it is opened); back faces = the outside page.
         The back of the inside-left column is the cover, so the folded stack naturally shows the cover. */
      const panel=(left,kIn,kOut,cls)=>{
        const p=div('p '+cls,null,`left:${left}px;width:${PW}px;height:${PH}px`);
        div('f',p,`background-image:url(${IMG[inn]});background-position:${-kIn*PW}px 0`);
        div('b',p,`background-image:url(${IMG[out]});background-position:${-kOut*PW}px 0`);
        return p;
      };
      const M=panel(PW,1,1,'m'), L=panel(-PW,0,2,'l'), R=panel(PW,2,0,'r');
      L.style.transformOrigin='100% 50%'; R.style.transformOrigin='0% 50%';
      M.appendChild(L); M.appendChild(R); sheet.appendChild(M);
      L.style.transform=FL; R.style.transform=FR;
      it.L=L; it.R=R;
    }});
  return it;
}
function card(id,parent,x,rz){
  return mk(id,{parent,w:350,h:200,fw:350,fh:200,type:'card',slide:0,
    rest:{x,y:300,z:16,rz,s:.62},focus:{x,y:-30,z:FZ,rz:0,s:1},
    build:(s2)=>{
      s2.className='s2 cardwrap';
      const bc=div('bc',s2);
      bc.innerHTML=`<img class="bl" src="${IMG.logo}" alt=""><div class="bn">Devin Kampa</div><div class="br">Loan Officer<br>NMLS #2532480</div><div class="bp"><b>C:</b>320.241.5823</div><div class="bm">DKampa@HighlandsMortgage.com<br>www.highlandsmortgage.com/agents/Devin-Kampa</div><div class="bph" style="background-image:url(${IMG.cardphoto})"></div><div class="bs"></div>`;
      div('slit a',s2); div('slit b',s2);
    }});
}
function paperCopies(parent,key,cx,cy,list){
  const host=$(parent==='L'?'#itemsL':'#itemsR'), ox=parent==='L'?600:0;
  list.forEach(([dx,dy,r,z])=>{
    div('copy',host,`width:530px;height:682px;background-image:url(${IMG[key]});background-size:100% 100%;`+
      `translate:${cx+dx+ox-265}px ${cy+dy+400-341}px;transform:translateZ(${z}px) rotateZ(${r}deg)`);
  });
}
/* extra copies behind each handout, just to make the pockets look full */
paperCopies('L','flyer',-300,29,[[-11,-15,-2.4,.6],[10,-8,1.7,1.2]]);
paperCopies('R','cheat',284,-19,[[-12,-14,-2.6,.6],[9,-8,1.5,1.2]]);
paperCopies('R','product',316,49,[[-9,-9,-1.7,3.0],[10,-5,1.9,3.5]]);
/* Left pocket: flyer in back, two trifold stacks in front. Right pocket: cheat sheet in back, product highlights in front. */
paper('flyer','L','flyer',{x:-300,y:29,z:2,rz:-1},-300);
tri('triA','L','proc1','proc2',-425,106.5);
tri('triB','L','high1','high2',-175,106.5);
paper('cheat','R','cheat',{x:284,y:-19,z:2,rz:-1.2},300);
paper('product','R','product',{x:316,y:49,z:4,rz:1},300);
card('cardR','R',300,2);
/* cards live in front of the pocket: move them into the card layers */
$('#cardsR').appendChild(items.cardR.el);

/* ---------- choreography ---------- */
function foldUp(it,d){ // right column closes first, then the left column goes back on top
  it.R.style.transition=`transform .8s ease-in-out ${d}s`; it.R.style.transform=FR;
  it.L.style.transition=`transform .8s ease-in-out ${d+.5}s`; it.L.style.transform=FL;
  it.tsh.style.transition='opacity .3s ease'; it.tsh.style.opacity=0;
  return 1.3;
}
function unfold(it,d){ // left side opens first, then the right side, revealing the whole page
  it.L.style.transition=`transform 1.1s ease-in-out ${d}s`; it.L.style.transform=UL;
  it.R.style.transition=`transform 1.1s ease-in-out ${d+.85}s`; it.R.style.transform=UR;
  it.tsh.style.transition=`opacity .8s ease ${d+1.6}s`; it.tsh.style.opacity=1;
}
function toFocus(it,d,flip){
  const S=it.slide, lead=S?.55:0;
  if(S){ it.s1.style.transition=`translate .7s ${E2} ${d}s`; it.s1.style.translate=`0 ${-S}px`; }
  it.s2.style.transition=`translate 1.3s ${E1} ${d+lead}s`; it.s2.style.translate=`0 ${S}px`;
  it.el.style.transition=`translate 1.3s ${E1} ${d+lead}s, transform 1.3s ${E1} ${d+lead}s`;
  pose(it,Object.assign({},it.focus,{flip}));
  if(it.type==='tri') unfold(it,d+lead+.8);
  it.el.classList.add('fz');
}
function flipTo(it,flip){
  it.el.style.transition=`translate 0s, transform 1.3s ${E1} 0s`;
  pose(it,Object.assign({},it.focus,{flip}));
}
function toRest(it,d){
  const S=it.slide; let t=d;
  if(it.type==='tri') t+=foldUp(it,d);
  it.s2.style.transition=`translate .9s ${E1} ${t}s`; it.s2.style.translate='0 0px';
  it.el.style.transition=`translate .9s ${E1} ${t}s, transform .8s ${E1} ${t+(S?.85:0)}s`;
  pose(it,it.rest);
  if(S){ it.s1.style.transition=`translate .7s ${E2} ${t+1.5}s`; it.s1.style.translate='0 0px'; }
  it.el.classList.remove('fz');
}
const dropTotal=it=>(it.type==='tri'?1.2:0)+(it.slide?2.2:1.0);
function hoverOn(it){
  if(it.state!=='rest') return;
  if(it.slide){ it.s1.style.transition=`translate .5s ${E3}`; it.s1.style.translate=`0 -110px`; }
  else { it.el.style.transition=`transform .4s ${E3}`; pose(it,Object.assign({},it.rest,{z:it.rest.z+34,s:(it.rest.s||1)*1.14})); }
}
function hoverOff(it){
  if(it.state!=='rest') return;
  if(it.slide){ it.s1.style.transition=`translate .5s ${E3}`; it.s1.style.translate=`0 0px`; }
  else { it.el.style.transition=`transform .4s ${E3}`; pose(it,it.rest); }
}

/* ---------- scenes ---------- */
const OV={cx:0,cy:0,w:1320,h:860,tilt:13,yaw:0,dy:-8};
const SC=[
 {id:'closed',open:0,cam:{cx:300,cy:0,w:700,h:900,tilt:15,yaw:-7,dy:-14},t:'Open house folder',s:'From Devin Kampa at Highlands Residential Mortgage.'},
 {id:'open',open:1,cam:OV,dur:3.6,t:"Here's what's inside",s:'Five handouts and my business card.'},
 {id:'flyer',focus:'flyer',dur:9,dot:0,t:'Limited time opportunity',s:'This flyer shows how lender incentives or seller concessions can lower your payment, whether through temporary rate buydowns or a permanent rate buydown, with the monthly principal and interest payment shown for each.'},
 {id:'triA',focus:'triA',flip:0,dur:9.2,dot:1,t:'The mortgage process',s:'Inside: The documents buyers need, tips for a smooth loan process, and the loan types we offer.'},
 {id:'triAout',focus:'triA',flip:1,dur:5.6,dot:1,t:'The mortgage process',s:'Major milestones, from pre-qualification to closing.'},
 {id:'triB',focus:'triB',flip:0,dur:9.2,dot:1,t:'Finding the right loan',s:'Conventional, FHA, VA, USDA, and specialized programs.'},
 {id:'triBout',focus:'triB',flip:1,dur:5.6,dot:1,t:'A higher standard of lending',s:'Who Highlands is and how we work with buyers.'},
 {id:'cheat',focus:'cheat',dur:8.2,dot:2,t:'Seller concession cheat sheet',s:'Maximum seller contributions by loan type, at a glance.'},
 {id:'product',focus:'product',dur:8,dot:3,t:'Product highlights',s:'Conventional, FHA, VA, USDA, jumbo, renovation, and more, all on one page.'},
 {id:'done',open:1,cam:OV,explore:true,t:"That's the folder.",s:'Hover or tap anything to take a closer look.',x:'Want your own custom listing folder? Contact me today!'}
];
const DOTS=[2,3,7,8];
const ALT={triA:SC[4],triB:SC[6]};
const FOCUS_CAP={
  flyer:SC[2], triA:SC[3], triB:SC[5], cheat:SC[7], product:SC[8],
  cardR:{t:'My business card',s:'Call, text, or email anytime.'}
};

let cur=SC[0], idx=0, playing=false, timer=null, hoverReady=false, hrT=null, perspective=2400, hazeOn=0, focusMode=false;

function setPerspective(){ perspective=Math.round(Math.max(innerWidth,innerHeight)*1.7); stage.style.perspective=perspective+'px'; }
function capSpace(sc){
  const vw=innerWidth, w=Math.min(vw*.92,680), fs=Math.min(17,Math.max(14,vw*.017)), tfs=Math.min(32,Math.max(22,vw*.031));
  const cpl=Math.floor(w/(fs*.5)), lines=Math.ceil((sc.s||'').length/cpl)+(sc.x?Math.ceil(sc.x.length/Math.floor(cpl*.88))*1.15+.5:0);
  const cta=(sc.id==='closed'||sc.explore||sc.id==='card')?62:0;
  return Math.round((vw<640?78:84)+tfs*1.12+8+lines*fs*1.4+cta+18);
}
function applyCam(sc,ms){
  const vw=innerWidth, vh=innerHeight, P=perspective;
  let sp;
  if(sc.focus){ const it=items[sc.focus], fp=it.focus, k=fp.s||1;
    sp={cx:fp.x,cy:fp.y,w:it.fw*k,h:it.fh*k,z:FZ,tilt:0,yaw:0,fit:.91}; }
  else sp=sc.cam;
  const top=26, bottom=capSpace(sc);
  const s0=Math.min(vw*.94/sp.w,(vh-top-bottom)/sp.h)*(sp.fit||.98);
  const z=sp.z||0, s=s0*P/(P+s0*z);
  const dy=(top-bottom)/2+(sp.dy||0);
  if(ms!==undefined) cam.style.transitionDuration=ms+'s';
  cam.style.transform=`translate3d(0,${dy}px,0) rotateX(${sp.tilt}deg) rotateY(${sp.yaw}deg) scale3d(${s},${s},${s}) translate3d(${-sp.cx}px,${-sp.cy}px,0)`;
}
function apply(sc,instant){
  const prev=cur; cur=sc; hoverReady=false; clearTimeout(hrT);
  if(instant){ stage.classList.add('inst'); }
  const fid=sc.focus||null;
  let drop=null; order.forEach(it=>{ if(it.state==='focus'&&it.id!==fid) drop=it; });
  const d=(drop&&fid)?Math.max(0,dropTotal(drop)-.9):0;
  order.forEach(it=>{
    if(it.id===fid){
      if(it.state!=='focus'){ it.state='focus'; it.flip=sc.flip||0; toFocus(it,d,it.flip); }
      else if((sc.flip||0)!==it.flip){ it.flip=sc.flip||0; flipTo(it,it.flip); }
    } else if(it.state==='focus'){ it.state='rest'; toRest(it,0); }
  });
  // folder
  const isOpen=sc.id!=='closed';
  stage.classList.toggle('is-closed',!isOpen);
  cover.style.transform=isOpen?'rotateY(-180deg)':'rotateY(0deg)';
  cover.style.translate=isOpen?'0 0 0px':'0 0 36px';
  floorL.style.transitionDelay=isOpen?'1.1s':'0s'; floorL.style.opacity=isOpen?1:0;
  // haze
  const want=fid?1:0;
  if(want!==hazeOn){ hazeOn=want;
    const hd=want? d+.3 : ((drop?(drop.type==='tri'?1.2:0):0)+.7);
    haze.style.transition=`opacity ${want?1.1:1.3}s ease ${hd}s`; haze.style.opacity=want; }
  const opening=(prev.id==='closed'&&isOpen);
  applyCam(sc, opening?2.1:(fid&&!prev.focus?1.8:1.7));
  if(instant){ void stage.offsetWidth; requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('inst'))); }
  if(sc.explore) hrT=setTimeout(()=>{hoverReady=true},900);
  armZones(!!sc.explore);
  par.style.transform = fid? 'none' : par.style.transform;
  ui(sc);
}

/* ---------- ui ---------- */
const capTxt=$('#capTxt'), capT=$('#capT'), capS=$('#capS'), capX=$('#capX');
let capKey='';
function setCap(t,s,x){
  x=x||''; const k=t+'|'+s+'|'+x; if(k===capKey) return; capKey=k;
  capTxt.classList.add('out');
  setTimeout(()=>{capT.textContent=t;capS.textContent=s;capX.textContent=x;capTxt.classList.remove('out')},300);
}
const show=(id,on)=>$(id).classList.toggle('hide',!on);
function ui(sc){
  const closed=sc.id==='closed', done=!!sc.explore, exFocus=focusMode, pres=!closed&&!done&&!exFocus;
  setCap(sc.t,sc.s,sc.x);
  show('#openB',closed);
  show('#contact',done||(exFocus&&sc.id==='card'));
  show('#bar',pres);
  show('#skipB',pres);
  show('#replayB',done);
  show('#closeB',exFocus);
  show('#fullB',(pres&&!!sc.focus)||(exFocus&&sc.id!=='card'));
  show('#flipB',exFocus&&sc.focus&&items[sc.focus].type==='tri');
  document.querySelectorAll('#dots button').forEach((b,i)=>b.classList.toggle('on',sc.dot===i));
}
const dotsEl=$('#dots');
DOTS.forEach((si,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label','Go to item '+(i+1)); b.onclick=()=>go(si); dotsEl.appendChild(b); });

/* ---------- playback ---------- */
function go(i,instant){
  clearTimeout(timer); focusMode=false; $('#backdrop').classList.remove('on');
  idx=Math.max(0,Math.min(SC.length-1,i)); const sc=SC[idx];
  apply(sc,instant);
  if(playing&&sc.dur) timer=setTimeout(()=>go(idx+1),sc.dur*1000);
  if(sc.explore) playing=false;
  setPP();
}
function setPP(){ $('#ppI').innerHTML=playing?'<path d="M8 5v14M16 5v14"/>':'<path d="M7 4.5v15l12-7.5z"/>'; $('#ppB').setAttribute('aria-label',playing?'Pause':'Play'); }
function start(){ playing=true; go(1); }
$('#openB').onclick=start;
$('#coverFront').addEventListener('click',()=>{ if(idx===0) start(); });
$('#nextB').onclick=()=>{ go(idx+1); };
$('#prevB').onclick=()=>{ go(Math.max(1,idx-1)); };
$('#ppB').onclick=()=>{ playing=!playing; clearTimeout(timer); setPP(); if(playing&&SC[idx].dur) timer=setTimeout(()=>go(idx+1),SC[idx].dur*1000); };
$('#skipB').onclick=()=>{ playing=false; go(SC.length-1); };
$('#replayB').onclick=()=>{ playing=true; go(2); };

/* ---------- explore ---------- */
let exId=null;
function focusItem(id){
  if(focusMode) return;
  const it=items[id]; order.forEach(o=>hoverOff(o));
  focusMode=true; exId=id; hoverReady=false;
  const cap=FOCUS_CAP[id];
  const sc={id:it.type==='card'?'card':id,open:1,focus:id,flip:0,t:cap.t,s:cap.s,x:it.type==='card'?'Want your own custom listing folder? Contact me today!':undefined};
  $('#backdrop').classList.add('on');
  apply(sc);
}
function unfocus(){
  if(!focusMode) return;
  focusMode=false; $('#backdrop').classList.remove('on');
  apply(SC[SC.length-1]);
}
$('#backdrop').onclick=unfocus;
$('#closeB').onclick=unfocus;
$('#flipB').onclick=()=>{ if(!focusMode) return; const f=(cur.flip||0)^1, a=items[cur.focus].type==='tri'?(f?ALT[cur.focus]:FOCUS_CAP[cur.focus]):null;
  const sc=Object.assign({},cur,{flip:f},a?{t:a.t,s:a.s}:{}); apply(sc); };
/* Hit zones: fixed, invisible targets over each piece's visible area, so hover and click
   don't depend on the moving (and overlapping) paper itself. */
const ZONES={
  flyer:  {p:'L',x:25, y:72, w:550,h:466,z:40,up:110},
  triA:   {p:'L',x:58, y:232,w:238,h:306,z:46,up:110},
  triB:   {p:'L',x:308,y:232,w:238,h:306,z:46,up:110},
  cheat:  {p:'R',x:6,  y:22, w:555,h:516,z:40,up:110},
  product:{p:'R',x:38, y:92, w:555,h:446,z:46,up:110},
  cardR:  {p:'R',x:188,y:636,w:224,h:130,z:50,up:0}
};
const zoneEls=[];
Object.entries(ZONES).forEach(([id,z])=>{
  const it=items[id], host=z.p==='L'?$('#faceL'):$('#base');
  const el=div('zone',host,`left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px;transform:translateZ(${z.z}px)`);
  el.setAttribute('role','button'); el.tabIndex=-1; el.setAttribute('aria-label',FOCUS_CAP[id].t);
  const ext=on=>{ el.style.top=(z.y-(on?z.up:0))+'px'; el.style.height=(z.h+(on?z.up:0))+'px'; el.style.transform=`translateZ(${z.z+(on?6:0)}px)`; };
  el.addEventListener('pointerenter',e=>{ if(e.pointerType!=='mouse'||!hoverReady||focusMode||!cur.explore) return; ext(true); hoverOn(it); });
  el.addEventListener('pointerleave',e=>{ if(e.pointerType!=='mouse') return; ext(false); hoverOff(it); });
  el.addEventListener('click',()=>{ ext(false); if(cur.explore) focusItem(id); });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(cur.explore) focusItem(id); } });
  zoneEls.push(el);
});
function armZones(on){ stage.classList.toggle('ex',on); zoneEls.forEach(z=>z.tabIndex=on?0:-1); }

/* ---------- reader ---------- */
function openReader(){
  const id=cur.focus; if(!id) return; const it=items[id];
  const keys=it.type==='tri'?[it.out,it.inn]:[it.key];
  $('#readerPages').innerHTML=keys.map(k=>`<img src="${IMG[k]}" alt="">`).join('');
  $('#reader').classList.add('on'); $('#reader').scrollTop=0;
  if(playing){ playing=false; clearTimeout(timer); setPP(); }
}
$('#fullB').onclick=openReader;
$('#readerClose').onclick=()=>$('#reader').classList.remove('on');

/* ---------- misc ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#reader').classList.contains('on')) $('#reader').classList.remove('on'); else unfocus(); }
  else if(idx>0&&!focusMode&&!cur.explore){
    if(e.key==='ArrowRight') go(idx+1); else if(e.key==='ArrowLeft') go(Math.max(1,idx-1));
    else if(e.key===' '){ e.preventDefault(); $('#ppB').click(); }
  }
});
addEventListener('pointermove',e=>{
  if(cur.focus||matchMedia('(prefers-reduced-motion:reduce)').matches||e.pointerType!=='mouse') return;
  const x=e.clientX/innerWidth-.5, y=e.clientY/innerHeight-.5;
  par.style.transform=`rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg)`;
});
addEventListener('resize',()=>{ setPerspective(); stage.classList.add('inst'); applyCam(cur); void stage.offsetWidth; requestAnimationFrame(()=>stage.classList.remove('inst')); });

if(window.top!==window.self){ document.querySelectorAll('#contact a').forEach(a=>{a.target='_blank';a.rel='noopener'}); }
setPerspective(); setPP();
apply(SC[0],true);
window.__dbg={go,SC,items,apply,get cur(){return cur}};
})();
</script>
</body>
